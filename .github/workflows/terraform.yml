name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]
      environment:
        description: "Environment to target (selects the matching workspace and vars/<environment>.tfvars)"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  pull-requests: write # to post the plan output as a PR comment
  id-token: write       # for OIDC auth to AWS (no long-lived keys)

env:
  TF_WORKING_DIR: terraform/environments/app
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  lint:
    name: Format & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive terraform/

      - name: terraform init (no backend, validate only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  security-scan:
    name: Lint & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tflint: provider-aware linting (catches things terraform validate
      # doesn't, like an instance type that doesn't exist for a given
      # engine, or a deprecated argument).
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --chdir=terraform

      # checkov: security/compliance misconfigurations (open security
      # groups, missing encryption, no deletion protection, etc).
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true # report findings without failing the build yet — see README

      # tfsec's checks now live inside Trivy's IaC config scanner, so this
      # reuses the same tool already used for the Docker image scan
      # (docker-build.yml) instead of adding a second, now-unmaintained
      # standalone tfsec action.
      - name: Trivy IaC config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "config"
          scan-ref: "terraform"
          severity: "HIGH,CRITICAL"
          exit-code: "0" # report only — see README on why this isn't blocking yet

  plan:
    name: Plan
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # OIDC federation — no static AWS keys stored as secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: terraform workspace select
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform workspace select -or-create ${{ github.event.inputs.environment || 'dev' }}

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -var-file="vars/${{ github.event.inputs.environment || 'dev' }}.tfvars" -out=tfplan

  apply:
    name: Apply
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    # Manual trigger only — no automatic apply on push, to keep this
    # portfolio project from accidentally provisioning real AWS spend.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    environment: production # requires a manual approval gate configured in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: terraform workspace select
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform workspace select -or-create ${{ github.event.inputs.environment }}

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -var-file="vars/${{ github.event.inputs.environment }}.tfvars"
