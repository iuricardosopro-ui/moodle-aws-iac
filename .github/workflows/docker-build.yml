name: Build & push Moodle image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the new image to"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write # OIDC auth to AWS, no static keys

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # A plain push to main (no workflow_dispatch input) always targets dev —
  # promoting the same image to staging/prod is a deliberate manual
  # workflow_dispatch, same as terraform.yml's apply job.
  PROJECT_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-and-push:
    name: Build, scan and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve environment-scoped resource names
        id: names
        run: |
          echo "ecr_repository=moodle-portfolio-${PROJECT_ENV}-moodle" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=moodle-portfolio-${PROJECT_ENV}-cluster" >> "$GITHUB_OUTPUT"
          echo "ecs_service=moodle-portfolio-${PROJECT_ENV}-moodle-svc" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: docker
        run: |
          docker build \
            --tag "${{ steps.ecr-login.outputs.registry }}/${{ steps.names.outputs.ecr_repository }}:${{ github.sha }}" \
            --tag "${{ steps.ecr-login.outputs.registry }}/${{ steps.names.outputs.ecr_repository }}:latest" \
            .

      # Fails the build on HIGH/CRITICAL CVEs instead of shipping them silently.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ steps.names.outputs.ecr_repository }}:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Push image (immutable tag + latest)
        run: |
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ steps.names.outputs.ecr_repository }}:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/${{ steps.names.outputs.ecr_repository }}:latest"

      - name: Update ECS service with the new image
        run: |
          aws ecs update-service \
            --cluster "${{ steps.names.outputs.ecs_cluster }}" \
            --service "${{ steps.names.outputs.ecs_service }}" \
            --force-new-deployment
